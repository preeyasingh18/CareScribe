<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- CareScribe favicon: the logo's "C" ring + microphone, reduced to the two
       shapes that still read at 16px, on a brand-violet tile so it holds up in
       both light and dark browser chrome. -->
  <defs>
    <linearGradient id="cs-fav" x1="0" y1="64" x2="64" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4c1d95"/>
      <stop offset="55%" stop-color="#6d28d9"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="14" fill="url(#cs-fav)"/>

  <g fill="none" stroke="#ffffff" stroke-linecap="round">
    <!-- open "C" -->
    <path d="M44.23 20.19A17 17 0 1 0 44.23 43.81" stroke-width="6"/>
    <!-- microphone cradle, stem and base -->
    <path d="M25.5 30.5A6.5 6.5 0 0 0 38.5 30.5" stroke-width="2.6"/>
    <path d="M32 37V42" stroke-width="2.6"/>
    <path d="M27 42h10" stroke-width="2.6"/>
  </g>
  <!-- microphone capsule -->
  <rect x="28.5" y="20" width="7" height="13" rx="3.5" fill="#ffffff"/>
</svg>
