<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none" role="img" aria-label="CareScribe">
  <!-- Standalone CareScribe mark (transparent background), geometry identical
       to <LogoMark/> in src/components/Logo.tsx. Use this for READMEs, OG
       images, e-mail signatures and anything outside React. -->
  <defs>
    <linearGradient id="cs-ring" x1="10" y1="50" x2="48" y2="12" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4c1d95"/>
      <stop offset="55%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="cs-mic" x1="42" y1="26" x2="42" y2="39" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#9b7bf7"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
  </defs>

  <!-- open "C" -->
  <path d="M42.12 18.29A19 19 0 1 0 42.12 43.71" stroke="url(#cs-ring)" stroke-width="7" stroke-linecap="round"/>

  <!-- clinical note with folded corner -->
  <path d="M27 15h13.5l6 6v21.5A2.5 2.5 0 0 1 44 45H27a2.5 2.5 0 0 1-2.5-2.5v-25A2.5 2.5 0 0 1 27 15Z" fill="#ede9fe"/>
  <path d="M40.5 15l6 6h-4a2 2 0 0 1-2-2v-4Z" fill="#c4b5fd"/>

  <!-- medical cross -->
  <rect x="29.4" y="18.3" width="3.2" height="8.4" rx="1.2" fill="#7c3aed"/>
  <rect x="26.8" y="20.9" width="8.4" height="3.2" rx="1.2" fill="#7c3aed"/>

  <!-- transcript lines -->
  <rect x="26.8" y="29.5" width="16" height="1.9" rx="0.95" fill="#a78bfa"/>
  <rect x="26.8" y="33.5" width="12.5" height="1.9" rx="0.95" fill="#a78bfa"/>

  <!-- waveform -->
  <rect x="26.8" y="38" width="1.3" height="4" rx="0.65" fill="#7c3aed"/>
  <rect x="29.5" y="36" width="1.3" height="8" rx="0.65" fill="#7c3aed"/>
  <rect x="32.2" y="35" width="1.3" height="10" rx="0.65" fill="#7c3aed"/>
  <rect x="34.9" y="37.25" width="1.3" height="5.5" rx="0.65" fill="#7c3aed"/>

  <!-- microphone -->
  <rect x="38.5" y="26" width="7" height="13" rx="3.5" fill="url(#cs-mic)"/>
  <g stroke="#2e1065" stroke-width="2.4" stroke-linecap="round">
    <path d="M36 34.5A6 6 0 0 0 48 34.5"/>
    <path d="M42 40.5V46"/>
    <path d="M37.5 46h9"/>
    <path d="M48 34.5c3.5 0 5-2 5-4.3"/>
  </g>

  <!-- stethoscope chest piece with heart -->
  <circle cx="53" cy="24" r="6.2" fill="#ffffff" stroke="#2e1065" stroke-width="2.4"/>
  <path d="M53 27.1c-3.2-2.05-3.8-3.2-3.8-4.35a2.15 2.15 0 0 1 3.8-1.3 2.15 2.15 0 0 1 3.8 1.3c0 1.15-.6 2.3-3.8 4.35Z" fill="#7c3aed"/>
</svg>
